<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<title th:text="|${#temporals.format(date, 'yyyy/M/d')}の${room.roomName}|">2016/5/20の豊洲</title>
<style>
	body {
		margin: 0;
		min-height: 100vh;
		font-family: "Segoe UI", Arial, sans-serif;
		background: radial-gradient(circle at top, #161b23 0%, #0d1117 100%);
		color: #e8ebf2;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	.reserve-card {
		width: min(100%, 540px);
		padding: 30px;
		border-radius: 20px;
		background: rgba(20, 27, 37, 0.96);
		box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
		border: 1px solid rgba(255, 255, 255, 0.08);
	}

	.reserve-card h3 {
		margin: 0 0 18px;
		font-size: 1.6rem;
		text-align: center;
	}

	.back-link {
		margin-bottom: 20px;
		text-align: center;
	}

	.back-link a {
		color: #7fb069;
		text-decoration: none;
		font-weight: 600;
	}

	.back-link a:hover {
		text-decoration: underline;
	}

	.error-message {
		margin-bottom: 20px;
		color: #f87171;
		font-size: 0.95rem;
		text-align: center;
	}

	.info-row {
		display: flex;
		justify-content: space-between;
		gap: 12px;
		flex-wrap: wrap;
		margin-bottom: 18px;
	}

	.info-label {
		font-weight: 700;
		min-width: 90px;
		color: #d7dde8;
	}

	.info-value {
		flex: 1;
		color: #e8ebf2;
	}

	.form-row {
		display: flex;
		flex-wrap: wrap;
		gap: 12px;
		align-items: center;
		margin-bottom: 16px;
	}

	.form-row label {
		min-width: 90px;
		font-weight: 600;
		color: #d7dde8;
	}

	.form-row select {
		flex: 1;
		padding: 10px 12px;
		border: 1px solid rgba(255, 255, 255, 0.12);
		border-radius: 12px;
		background: rgba(255, 255, 255, 0.05);
		font-size: 1rem;
		color: #e8ebf2;
	}

	.form-row select:focus {
		border-color: #7fb069;
		background: rgba(255, 255, 255, 0.1);
	}

	.form-row span.error-text {
		color: #f87171;
		font-size: 0.9rem;
		margin-left: 8px;
	}

	.reserve-button {
		display: block;
		width: 100%;
		padding: 14px 16px;
		margin-top: 12px;
		border: none;
		border-radius: 12px;
		background: #2d6a4f;
		color: #ffffff;
		font-size: 1rem;
		font-weight: 700;
		cursor: pointer;
		box-shadow: 0 12px 24px rgba(45, 106, 79, 0.3);
		transition: background 0.2s ease, transform 0.2s ease;
	}

	.reserve-button:hover {
		transform: translateY(-1px);
		background: #235f43;
	}

	.reservations-table {
		width: 100%;
		border-collapse: collapse;
		margin-top: 28px;
	}

	.reservations-table th,
	.reservations-table td {
		padding: 14px 12px;
		text-align: left;
		border-bottom: 1px solid rgba(255, 255, 255, 0.08);
	}

	.reservations-table th {
		font-weight: 700;
		color: #cbd5e1;
	}

	.reservations-table td {
		color: #e8ebf2;
	}

	.reservations-table tr:hover {
		background: rgba(255, 255, 255, 0.04);
	}

	.cancel-button {
		padding: 10px 14px;
		border: none;
		border-radius: 10px;
		background: #dc3545;
		color: #ffffff;
		font-size: 0.95rem;
		cursor: pointer;
	}

	.cancel-button:hover {
		background: #b02424;
	}
</style>
</head>
<body th:with="user=${#authentication.principal.user}">
	<div class="reserve-card">
		<h3 th:text="|${#temporals.format(date, 'yyyy/M/d')}の${room.roomName}|">2016/5/20の豊洲</h3>
		<div class="back-link">
			<a th:href="@{'/rooms/' + ${date}}">会議室一覧へ</a>
		</div>
		<p class="error-message" th:if="${error != null}" th:text="${error}"></p>
		<form th:object="${reservationForm}"
			  th:action="@{'/reservations/' + ${date} + '/' + ${roomId}}"
			  method="post">
			<div class="info-row">
				<div>
					<div class="info-label">会議室</div>
					<div class="info-value" th:text="${room.roomName}">豊洲</div>
				</div>
				<div>
					<div class="info-label">予約者</div>
					<div class="info-value" th:text="${user.lastName + ' ' + user.firstName}">山田 太郎</div>
				</div>
				<div>
					<div class="info-label">日付</div>
					<div class="info-value" th:text="${#temporals.format(date, 'yyyy/M/d')}">2016/5/20</div>
				</div>
			</div>
			<div class="form-row">
				<label>時間帯</label>
				<select th:field="*{startTime}">
					<option th:each="time : ${timeList}" th:text="${time}" th:value="${time}">09:00</option>
				</select>
				<span>-</span>
				<select th:field="*{endTime}">
					<option th:each="time : ${timeList}" th:text="${time}" th:value="${time}">10:00</option>
				</select>
			</div>
			<div class="form-row">
				<span class="error-text" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}">error!</span>
				<span class="error-text" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}">error!</span>
			</div>
			<button type="submit" class="reserve-button">予約</button>
		</form>
		<table class="reservations-table">
			<tr>
				<th>時間帯</th>
				<th>予約者</th>
				<th>操作</th>
			</tr>
			<tr th:each="reservation : ${reservations}">
				<td>
					<span th:text="${reservation.startTime}"></span> - <span th:text="${reservation.endTime}"></span>
				</td>
				<td>
					<span th:text="${reservation.user.lastName}"></span>
					<span th:text="${reservation.user.firstName}"></span>
				</td>
				<td>
					<form th:action="@{'/reservations/' + ${date} + '/' + ${roomId}}"
						  method="post"
						  sec:authorize="${hasRole('ADMIN') or #vars.user.userId == #vars.reservation.user.userId}">
						<input type="hidden" name="reservationId" th:value="${reservation.reservationId}" />
						<input type="submit" name="cancel" value="取消" class="cancel-button" />
					</form>
				</td>
			</tr>
		</table>
	</div>
</body>
</html>
