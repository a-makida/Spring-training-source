<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>ログイン</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Segoe UI", Helvetica, Arial, sans-serif;
			background: radial-gradient(circle at top, #20232a 0%, #12161d 100%);
			color: #e9ecef;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.login-card {
			width: min(100%, 400px);
			padding: 32px;
			border-radius: 16px;
			background: rgba(22, 28, 38, 0.96);
			box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
			text-align: center;
			border: 1px solid rgba(255, 255, 255, 0.08);
		}

		.login-card h3 {
			margin: 0 0 24px;
			font-size: 1.5rem;
			letter-spacing: 0.02em;
		}

		.login-card p.error {
			margin: 0 0 20px;
			color: #b00020;
			font-size: 0.95rem;
		}

		.login-card table {
			width: 100%;
			border-collapse: collapse;
		}

		.login-card td {
			padding: 10px 5px;
			vertical-align: middle;
		}

		.login-card label {
			display: inline-block;
			min-width: 90px;
			text-align: left;
			font-weight: 600;
		}

		.login-card input {
			width: 100%;
			padding: 10px 14px;
			border: 1px solid #d1d9e6;
			border-radius: 10px;
			font-size: 1rem;
			background: #f9fbff;
			outline: none;
			transition: border-color 0.2s ease;
		}

		.login-card input:focus {
			border-color: #6c8ef0;
			background: #ffffff;
		}

		.login-card .button-wrap {
			padding-top: 18px;
		}

		.login-card button {
			width: 100%;
			padding: 12px 16px;
			border: none;
			border-radius: 12px;
			background: #2d6a4f;
			color: #ffffff;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
			box-shadow: 0 10px 20px rgba(45, 106, 79, 0.22);
			transition: transform 0.2s ease, background 0.2s ease;
		}

		.login-card button:hover {
			transform: translateY(-1px);
			background: #235f43;
		}
	</style>
</head>
<body>
	<div class="login-card">
		<h3>ログインフォーム</h3>
		<p th:if="${param.error}" class="error">ユーザー名かパスワードが正しくありません。</p>
		<form th:action="@{/login}" method="POST">
			<table>
				<tr>
					<td><label for="username">User</label></td>
					<td><input type="text" id="username" name="username" value="aaaa" /></td>
				</tr>
				<tr>
					<td><label for="password">Password</label></td>
					<td><input type="password" id="password" name="password" value="demo" /></td>
				</tr>
			</table>
			<div class="button-wrap">
				<button type="submit">ログイン</button>
			</div>
		</form>
	</div>
</body>
</html>
