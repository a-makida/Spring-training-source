<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8" />
<title th:text="|${#temporals.format(date, 'yyyy/M/d')}の${room.roomName}|">2016/5/20の豊洲</title>
<style>
body {
margin: 0;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: radial-gradient(circle at top, #ffeaf0, #ffe5f2 35%, #f8d7e5 100%);
font-family: "Segoe UI", Arial, sans-serif;
color: #41243b;
cursor: none;
}
.page-card {
width: 100%;
max-width: 920px;
background: #ffffff;
border-radius: 18px;
box-shadow: 0 18px 45px rgba(160, 50, 110, 0.14);
padding: 32px;
box-sizing: border-box;
position: relative;
overflow: hidden;
}
.page-header {
display: flex;
align-items: flex-start;
justify-content: space-between;
gap: 16px;
margin-bottom: 24px;
}
.page-header a {
color: #b02e6d;
text-decoration: none;
font-weight: 600;
}
.page-header a:hover {
text-decoration: underline;
}
.section-title {
margin: 0;
font-size: 1.5rem;
}
.user-info {
margin-top: 8px;
font-size: 0.95rem;
color: #61415a;
}
.alert {
margin: 0 0 20px;
color: #c42c70;
background: #ffe4ef;
padding: 12px 14px;
border-radius: 10px;
}
.form-grid {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 18px;
margin-bottom: 22px;
}
.field-group {
display: flex;
flex-direction: column;
}
.field-group label {
margin-bottom: 8px;
font-size: 0.95rem;
}
.field-group span {
padding: 12px 14px;
border: 1px solid #f0c2dc;
border-radius: 10px;
background: #fff1f9;
font-size: 0.95rem;
}
.field-group select {
width: 100%;
padding: 12px 14px;
border: 1px solid #f0c2dc;
border-radius: 10px;
background: #fff1f9;
font-size: 0.95rem;
box-sizing: border-box;
}
.error-text {
color: #c42c70;
font-size: 0.9rem;
margin-top: 6px;
display: block;
}
.form-actions {
display: flex;
justify-content: flex-end;
}
button,
input[type="submit"] {
padding: 12px 16px;
border: none;
border-radius: 10px;
background: #d63384;
color: #ffffff;
font-size: 1rem;
font-weight: 600;
cursor: pointer;
transition: background 0.2s ease;
}
button:hover,
input[type="submit"]:hover {
background: #b02e6d;
}
.table-wrap {
overflow-x: auto;
}
table {
width: 100%;
border-collapse: collapse;
background: #fff7fb;
border-radius: 14px;
overflow: hidden;
}
th,
td {
padding: 14px 16px;
text-align: left;
border-bottom: 1px solid #f3d4e4;
}
th {
background: #f7d6e7;
color: #6b1f4f;
font-weight: 700;
}
tr:last-child td {
border-bottom: none;
}
td form {
margin: 0;
}
td input[type="submit"] {
padding: 10px 14px;
width: auto;
}
#cursor-heart {
position: fixed;
pointer-events: none;
z-index: 9999;
font-size: 20px;
color: #ff78b0;
text-shadow: 0 0 10px rgba(255, 120, 176, 0.9);
transform: translate(-50%, -50%);
}
#cursor-beam {
position: fixed;
pointer-events: none;
z-index: 9998;
width: 40px;
height: 6px;
border-radius: 999px;
background: linear-gradient(90deg, rgba(255,120,176,0.9), rgba(255,255,255,0.9), rgba(255,120,176,0.3));
transform-origin: left center;
}
.glitter-piece {
position: fixed;
pointer-events: none;
z-index: 998;
width: 5px;
height: 5px;
border-radius: 50%;
background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0) 70%);
box-shadow: 0 0 12px rgba(255,255,255,0.8);
opacity: 0;
animation: glitterMove 4s linear infinite;
}
@keyframes glitterMove {
0% {opacity: 0; transform: translateY(-20px) scale(0.4);}
20% {opacity: 1;}
80% {opacity: 1;}
100% {opacity: 0; transform: translateY(110vh) scale(0.8);}
}
.heart-particle {
position: fixed;
pointer-events: none;
z-index: 9999;
font-size: 18px;
color: #ff8fc8;
text-shadow: 0 0 10px rgba(255,143,200,0.8);
opacity: 1;
transform: translate(-50%, -50%) scale(1);
transition: transform 0.5s ease-out, opacity 0.5s ease-out;
}
</style>
</head>
<body th:with="user=${#authentication.principal.user}">
<div class="page-card">
<div class="page-header">
<div>
<p class="section-title" th:text="|${#temporals.format(date, 'yyyy/M/d')} ${room.roomName} 予約|">2016/5/20 豊洲 予約</p>
<p class="user-info">予約者: <strong th:text="${user.lastName + ' ' + user.firstName}">山田 太郎</strong></p>
</div>
<a th:href="@{'/rooms/' + ${date}}">会議室一覧へ</a>
</div>
<p th:if="${error != null}" class="alert" th:text="${error}"></p>
<form th:object="${reservationForm}"
  th:action="@{'/reservations/' + ${date} + '/' + ${roomId}}"
  method="post">
<div class="form-grid">
<div class="field-group">
<label>会議室</label>
<span th:text="${room.roomName}">豊洲</span>
</div>
<div class="field-group">
<label>日付</label>
<span th:text="${#temporals.format(date, 'yyyy/M/d')}">2016/5/20</span>
</div>
<div class="field-group">
<label for="startTime">開始時間</label>
<select id="startTime" th:field="*{startTime}">
<option th:each="time : ${timeList}" th:text="${time}" th:value="${time}">09:00</option>
</select>
<span th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}" class="error-text">error!</span>
</div>
<div class="field-group">
<label for="endTime">終了時間</label>
<select id="endTime" th:field="*{endTime}">
<option th:each="time : ${timeList}" th:text="${time}" th:value="${time}">10:00</option>
</select>
<span th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}" class="error-text">error!</span>
</div>
</div>
<div class="form-actions">
<button type="submit">予約する</button>
</div>
</form>
<div class="table-wrap">
<table>
<tr>
<th>時間帯</th>
<th>予約者</th>
<th>操作</th>
</tr>
<tr th:each="reservation : ${reservations}">
<td>
<span th:text="${reservation.startTime}"></span>
-
<span th:text="${reservation.endTime}"></span>
</td>
<td>
<span th:text="${reservation.user.lastName}"></span>
<span th:text="${reservation.user.firstName}"></span>
</td>
<td>
<form th:action="@{'/reservations/' + ${date} + '/' + ${roomId}}"
  method="post"
  sec:authorize="${hasRole('ADMIN') or #vars.user.userId == #vars.reservation.user.userId}">
<input type="hidden" name="reservationId" th:value="${reservation.reservationId}" />
<input type="submit" name="cancel" value="取消" />
</form>
</td>
</tr>
</table>
</div>
</div>
<div id="cursor-heart">❤</div>
<div id="cursor-beam"></div>
<script>//<![CDATA[
(function() {
const heart = document.getElementById('cursor-heart');
const beam = document.getElementById('cursor-beam');
let prevX = 0;
let prevY = 0;
function randomBetween(min, max) {
return min + Math.random() * (max - min);
}
function createGlitter() {
const glitter = document.createElement('div');
glitter.className = 'glitter-piece';
const size = randomBetween(3, 8);
glitter.style.width = size + 'px';
glitter.style.height = size + 'px';
glitter.style.left = randomBetween(0, 100) + 'vw';
glitter.style.top = randomBetween(-30, -5) + 'vh';
glitter.style.animationDuration = randomBetween(3, 6) + 's';
glitter.style.animationDelay = randomBetween(0, 4) + 's';
document.body.appendChild(glitter);
setTimeout(() => glitter.remove(), 8000);
}
for (let i = 0; i < 24; i++) {
createGlitter();
}
setInterval(createGlitter, 700);

document.addEventListener('mousemove', function(event) {
heart.style.left = event.clientX + 'px';
heart.style.top = event.clientY + 'px';
beam.style.left = (event.clientX + 10) + 'px';
beam.style.top = (event.clientY - 4) + 'px';
const dx = event.clientX - prevX;
const dy = event.clientY - prevY;
const angle = Math.atan2(dy, dx) * 180 / Math.PI;
beam.style.transform = 'translate(-50%, -50%) rotate(' + angle + 'deg)';
prevX = event.clientX;
prevY = event.clientY;
});
function spawnHeart(x, y) {
const particle = document.createElement('div');
particle.className = 'heart-particle';
particle.textContent = '❤';
particle.style.left = x + 'px';
particle.style.top = y + 'px';
document.body.appendChild(particle);
requestAnimationFrame(() => {
particle.style.transform = 'translate(-50%, -120%) scale(1.3)';
particle.style.opacity = '0';
});
setTimeout(() => particle.remove(), 700);
}

document.querySelectorAll('button, input[type="submit"]').forEach(button => {
button.addEventListener('click', function(event) {
spawnHeart(event.clientX, event.clientY);
});
});
})();
//]]></script>
</body>
</html>
