<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title th:text="|${#temporals.format(date, 'yyyy/M/d')}の会議室|">2016/5/20の会議室</title>
<style>
body {
margin: 0;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: radial-gradient(circle at top, #ffeaf0, #ffe5f2 35%, #f8d7e5 100%);
font-family: "Segoe UI", Arial, sans-serif;
color: #41243b;
cursor: none;
}
.page-card {
width: 100%;
max-width: 860px;
background: #ffffff;
border-radius: 18px;
box-shadow: 0 18px 45px rgba(160, 50, 110, 0.14);
padding: 32px;
box-sizing: border-box;
position: relative;
overflow: hidden;
}
.header-row {
display: flex;
justify-content: space-between;
align-items: center;
gap: 16px;
margin-bottom: 24px;
}
.header-row a {
color: #b02e6d;
text-decoration: none;
font-weight: 600;
}
.header-row a:hover {
text-decoration: underline;
}
.title {
margin: 0;
font-size: 1.5rem;
}
.room-list {
list-style: none;
padding: 0;
margin: 0;
display: grid;
grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
gap: 14px;
}
.room-item {
background: #fff1f9;
border: 1px solid #f0c2dc;
border-radius: 14px;
}
.room-item a {
display: block;
padding: 16px 18px;
color: #6b1f4f;
text-decoration: none;
font-size: 1rem;
font-weight: 600;
}
.room-item a:hover {
background: #f7d6e7;
}
.logout-form {
display: flex;
justify-content: flex-end;
margin-top: 22px;
}
button {
padding: 12px 16px;
border: none;
border-radius: 10px;
background: #d63384;
color: #ffffff;
font-size: 1rem;
font-weight: 600;
cursor: pointer;
transition: background 0.2s ease;
}
button:hover {
background: #b02e6d;
}
#cursor-heart {
position: fixed;
pointer-events: none;
z-index: 9999;
font-size: 20px;
color: #ff78b0;
text-shadow: 0 0 10px rgba(255, 120, 176, 0.9);
transform: translate(-50%, -50%);
}
#cursor-beam {
position: fixed;
pointer-events: none;
z-index: 9998;
width: 40px;
height: 6px;
border-radius: 999px;
background: linear-gradient(90deg, rgba(255,120,176,0.9), rgba(255,255,255,0.9), rgba(255,120,176,0.3));
transform-origin: left center;
}
.glitter-piece {
position: fixed;
pointer-events: none;
z-index: 998;
width: 5px;
height: 5px;
border-radius: 50%;
background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0) 70%);
box-shadow: 0 0 12px rgba(255,255,255,0.8);
opacity: 0;
animation: glitterMove 4s linear infinite;
}
@keyframes glitterMove {
0% {opacity: 0; transform: translateY(-20px) scale(0.4);}
20% {opacity: 1;}
80% {opacity: 1;}
100% {opacity: 0; transform: translateY(110vh) scale(0.8);}
}
.heart-particle {
position: fixed;
pointer-events: none;
z-index: 9999;
font-size: 18px;
color: #ff8fc8;
text-shadow: 0 0 10px rgba(255,143,200,0.8);
opacity: 1;
transform: translate(-50%, -50%) scale(1);
transition: transform 0.5s ease-out, opacity 0.5s ease-out;
}
</style>
</head>
<body>
<div class="page-card">
<div class="header-row">
<h3 class="title" th:text="|${#temporals.format(date, 'yyyy/M/d')}の会議室|">2016/5/20の会議室</h3>
<div>
<a th:href="@{'/rooms/' + ${date.minusDays(1)}}">&lt; 前日</a>
<a th:href="@{'/rooms/' + ${date.plusDays(1)}}" style="margin-left: 16px;">翌日 &gt;</a>
</div>
</div>
<ul class="room-list">
<li class="room-item" th:each="room: ${rooms}">
<a th:href="@{'/reservations/' + ${date} + '/' + ${room.meetingRoom.roomId}}"
   th:text="${room.meetingRoom.roomName}">会議室名</a>
</li>
</ul>
<div class="logout-form">
<form th:action="@{/logout}" method="post">
<button>ログアウト</button>
</form>
</div>
</div>
<div id="cursor-heart">❤</div>
<div id="cursor-beam"></div>
<script>//<![CDATA[
(function() {
const heart = document.getElementById('cursor-heart');
const beam = document.getElementById('cursor-beam');
let prevX = 0;
let prevY = 0;
function randomBetween(min, max) {
return min + Math.random() * (max - min);
}
function createGlitter() {
const glitter = document.createElement('div');
glitter.className = 'glitter-piece';
const size = randomBetween(3, 8);
glitter.style.width = size + 'px';
glitter.style.height = size + 'px';
glitter.style.left = randomBetween(0, 100) + 'vw';
glitter.style.top = randomBetween(-30, -5) + 'vh';
glitter.style.animationDuration = randomBetween(3, 6) + 's';
glitter.style.animationDelay = randomBetween(0, 4) + 's';
document.body.appendChild(glitter);
setTimeout(() => glitter.remove(), 8000);
}
for (let i = 0; i < 24; i++) {
createGlitter();
}
setInterval(createGlitter, 700);

document.addEventListener('mousemove', function(event) {
heart.style.left = event.clientX + 'px';
heart.style.top = event.clientY + 'px';
beam.style.left = (event.clientX + 10) + 'px';
beam.style.top = (event.clientY - 4) + 'px';
const dx = event.clientX - prevX;
const dy = event.clientY - prevY;
const angle = Math.atan2(dy, dx) * 180 / Math.PI;
beam.style.transform = 'translate(-50%, -50%) rotate(' + angle + 'deg)';
prevX = event.clientX;
prevY = event.clientY;
});
function spawnHeart(x, y) {
const particle = document.createElement('div');
particle.className = 'heart-particle';
particle.textContent = '❤';
particle.style.left = x + 'px';
particle.style.top = y + 'px';
document.body.appendChild(particle);
requestAnimationFrame(() => {
particle.style.transform = 'translate(-50%, -120%) scale(1.3)';
particle.style.opacity = '0';
});
setTimeout(() => particle.remove(), 700);
}

document.querySelectorAll('button, input[type="submit"]').forEach(button => {
button.addEventListener('click', function(event) {
spawnHeart(event.clientX, event.clientY);
});
});
})();
//]]></script>
</body>
</html>
